name: wondrous_compass
description: Guild Wars 2 companion app. Characters, account, trading post, world boss timers and the wiki.
publish_to: 'none'
version: 0.33.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # the material widgets, as a package of their own since flutter 3.47: package:flutter/material.dart is deprecated
  material_ui: ^1.11.1
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  supabase_flutter: ^2.17.2
  google_fonts: ^9.0.0
  url_launcher: ^6.3.1
  share_plus: '>=12.0.2 <15.0.0'
  path_provider: ^2.1.4
  # unpacks the bundled gzip data in a browser, where dart:io has no gzip
  archive: ^4.0.7
  # the address bar of a browser, to take away what a sign in that went wrong left in it
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    # the fonts of the app, with the app: the page and the phone do not ask Google Fonts for them
    - assets/google_fonts/
    # the map icons the game's files do not have, from the Guild Wars 2 wiki: the mastery points of each region
    - assets/map_icons/
    - assets/tiles/1/0/
    - assets/tiles/1/1/
    - assets/tiles/1/2/

# the browser part of the secure storage that runs as webassembly. its storage is the one of 1.x: the same keys in
# localStorage, the same AES-GCM key, so what a browser saved before is read as it was. the phones are not touched by it
dependency_overrides:
  flutter_secure_storage_web: 2.0.0-beta.2
