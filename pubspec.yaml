name: wondrous_compass
description: Guild Wars 2 companion app. Characters, account, trading post, world boss timers and the wiki.
publish_to: 'none'
version: 0.33.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  supabase_flutter: ^2.17.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  share_plus: '>=12.0.2 <15.0.0'
  path_provider: ^2.1.4
  # unpacks the bundled gzip data in a browser, where dart:io has no gzip
  archive: ^4.0.7
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/tiles/1/0/
    - assets/tiles/1/1/
    - assets/tiles/1/2/
