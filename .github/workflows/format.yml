name: Format

# formats every dart file with the official formatter and commits the
# result. runs on its own after code lands on main, since some commits come
# from places without a dart sdk, and can still be started by hand. its own
# commit is pushed with the workflow token, which never starts another run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --line-length 120 lib test
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "Yesanith"
          git config user.email "56350783+Yesanith@users.noreply.github.com"
          git commit -am "Apply dart format"
          # someone may push while this runs. replaying a formatting commit
          # on top of theirs is safe, try a few times
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
