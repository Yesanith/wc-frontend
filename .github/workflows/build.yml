name: Build APK

on:
  # only tags, so a release is built once instead of twice per push
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.21.0
        required: true
      release:
        description: Also publish it as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write
  # to see whether the recipe data job is still running
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the recipe job runs for a few minutes after a push. a release built
      # meanwhile would ship the old data, so wait for it first
      - name: Wait for the recipe data job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 100); do
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow data.yml --limit 20 \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$running" = "0" ]; then
              echo "no recipe job running"
              exit 0
            fi
            echo "recipe job still running, waiting ($i)"
            sleep 30
          done
          echo "::warning::gave up waiting for the recipe job, building with the data in the tag"

      - uses: actions/checkout@v4

      # the tag fixes the code, but the recipe job commits its data to main
      # afterwards. take the newest data from main so the release includes it
      - name: Use the newest recipe data
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- assets/data assets/tiles
          git status --short assets/data assets/tiles

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # a tag carries the version, a manual run is asked for one. the input
      # travels through the environment rather than being pasted into the
      # script, so a stray character cannot run as shell
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1 ;;
          esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION ($GITHUB_RUN_NUMBER)"

      # android/ is not committed, generate it from the flutter template
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.yesanith --project-name tyria_codex .
          # the template adds a counter app test for a MyApp we do not have
          rm -f test/widget_test.dart

      # the app icon is the emblem of the menu header, rendered by
      # tools/make_launcher_icon.py. it replaces the default flutter icon
      - name: Use the app icon
        run: cp -r ci/launcher/res/. android/app/src/main/res/

      # sign with a real release key, the flutter template would use the
      # public debug key which scanners flag as a test build
      - name: Use the release signing key
        run: python3 ci/sign.py

      # caches ~/.gradle between runs, so a build does not download the whole
      # kotlin and android plugin tree from maven central every time
      - uses: gradle/actions/setup-gradle@v4

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Tyria Codex"#' "$M"
          # signing in with discord ends in the browser, which sends the player
          # back to the app through tyriacodex://login-callback
          grep -q 'tyriacodex' "$M" || sed -i 's#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="tyriacodex" android:host="login-callback"/>\n            </intent-filter>\n        </activity>#' "$M"
          grep -c 'tyriacodex' "$M"
          # notifications use the one colour emblem, a full colour icon would be
          # a white square in the status bar
          grep -q 'default_notification_icon' "$M" || sed -i 's#<application#<application#; 0,/<activity/s#<activity#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_tyria"/>\n        <activity#' "$M"
          grep -c 'default_notification_icon' "$M"

      # the alerts before pinned world events are scheduled with the phone's
      # alarm system, which needs receivers, permissions and desugaring that
      # flutter create does not write
      - name: Set up scheduled notifications
        run: python3 ci/notifications.py

      - run: flutter pub get

      # a release never ships code that fails the checks
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          VERSION: ${{ steps.version.outputs.value }}
          KEYSTORE_PATH: ${{ github.workspace }}/ci/release.keystore
          KEYSTORE_PASSWORD: TyriaCodex2026
          KEY_ALIAS: tyriacodex
          KEY_PASSWORD: TyriaCodex2026
          # the community backend: an address and a key meant to be public,
          # access is enforced by row level security on the server
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # push notifications: the android app's firebase values, public by
          # design like the supabase key. without them notifications stay off
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # maven central sometimes answers 429 to shared runners, wait and retry
          for attempt in 1 2 3; do
            flutter build apk --release \
              --build-name="$VERSION" \
              --build-number="$GITHUB_RUN_NUMBER" \
              --dart-define=APP_VERSION="$VERSION" \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
              --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
              --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
              --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
              --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" 2>&1 | tee "$RUNNER_TEMP/build-attempt.log"
            # the result of the build, not of tee
            if [ "${PIPESTATUS[0]}" = "0" ]; then exit 0; fi
            cp "$RUNNER_TEMP/build-attempt.log" "$RUNNER_TEMP/build.log"
            echo "build attempt $attempt failed, retrying in 60s"
            sleep 60
          done
          exit 1

      # when the build fails, what it said goes to a branch of its own, replaced each time, so that it can be read without opening the run
      - name: Keep the failure where it can be read
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f "$RUNNER_TEMP/build.log" || exit 0
          dir="$(mktemp -d)"
          cd "$dir"
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs-build
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo
            # the errors first, then the end of the output
            grep -nE "FAILURE|error:|Error:|e: |What went wrong|Execution failed|Could not|> |BUILD FAILED|Exception" "$RUNNER_TEMP/build.log" | head -n 120
            echo
            echo "=================== the end"
            tail -n 120 "$RUNNER_TEMP/build.log"
          } > build-failure.txt
          git add build-failure.txt
          git commit -q -m "The failure of the build of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-build

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tyria-codex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tyria-codex-apk
          path: tyria-codex.apk

      # a tag push always publishes, a manual run only when the box was ticked.
      # the release creates the tag itself, and because this runs with the
      # workflow's own token it does not trigger a second build
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: tyria-codex.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
