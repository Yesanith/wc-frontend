name: Format branch

# formats the dart files of the branch it is started on and commits the result
# to it, for work done where there is no dart sdk. runs on every push to a
# feature branch, and its own commit never starts another run
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths: ['lib/**', 'test/**']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # the formatter takes the style from the language version of the project, which it finds only with the packages.
      # without them it uses the newest style, which the Check workflow does not accept
      - run: flutter pub get
      - run: dart format --line-length 120 lib test
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "Yesanith"
          git config user.email "56350783+Yesanith@users.noreply.github.com"
          git commit -am "Apply dart format"
          git push origin HEAD:${GITHUB_REF_NAME}
