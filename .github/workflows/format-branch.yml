name: Format branch

# formats the dart files of the branch it is started on and commits the result
# to it, for work done where there is no dart sdk. started by hand
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --line-length 120 lib test
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "Yesanith"
          git config user.email "56350783+Yesanith@users.noreply.github.com"
          git commit -am "Apply dart format"
          git push origin HEAD:${GITHUB_REF_NAME}
