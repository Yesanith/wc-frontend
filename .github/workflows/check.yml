name: Analyze and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# the check only reads, except for the branch of logs a failed test writes
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # same settings as the format workflow, so a push that skipped it fails
      # here instead of drifting until the next manual run
      # on main the Format workflow fixes it and commits, a red run there
      # would only report what is already being repaired
      - name: Check formatting
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: dart format --line-length 120 --set-exit-if-changed --output=none lib test

      # lint hints stay advisory, errors and warnings fail the run
      - run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"

      # when it fails, the end of the log goes to a branch of its own, one commit that is replaced each
      # time, so the failure can be read without opening the run
      - name: Keep the failure where it can be read
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f "$RUNNER_TEMP/flutter-test.log" || exit 0
          dir="$(mktemp -d)"
          cd "$dir"
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo
            # everything but the list of the tests that passed
            grep -v '^✅' "$RUNNER_TEMP/flutter-test.log" | head -n 500
          } > test-failure.txt
          git add test-failure.txt
          git commit -q -m "The test failure of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
