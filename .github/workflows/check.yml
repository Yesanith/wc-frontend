name: Analyze and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # same settings as the format workflow, so a push that skipped it fails
      # here instead of drifting until the next manual run
      # on main the Format workflow fixes it and commits, a red run there
      # would only report what is already being repaired
      - name: Check formatting
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: dart format --line-length 120 --set-exit-if-changed --output=none lib test

      # lint hints stay advisory, errors and warnings fail the run
      - run: flutter analyze --no-fatal-infos

      - run: flutter test
