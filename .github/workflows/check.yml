name: Analyze and test

# a push to a branch is checked once; a pull request of that branch is not checked again, since it is the same commit
on:
  push:
    branches: ['**']
  workflow_dispatch:

# a newer push to the same branch makes the run of the older one pointless
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# the check only reads
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # each step keeps its output, so that whichever fails can be read without opening the run
      - name: Packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/1-pub-get.log"

      # same settings as the format workflow, so a push that skipped it fails
      # here instead of drifting until the next manual run
      # on main the Format workflow fixes it and commits, a red run there
      # would only report what is already being repaired
      - name: Check formatting
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          set -o pipefail
          dart format --line-length 120 --set-exit-if-changed --output=none lib test 2>&1 | tee "$RUNNER_TEMP/2-format.log"

      # lint hints stay advisory, errors and warnings fail the run
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/3-analyze.log"

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/4-test.log"

      # when it fails, what each step said is kept in the bucket of Supabase (ci/keep.sh), so the failure can be read without
      # opening the run: the packages, the format, the analysis and the tests (without the list of those that passed)
      - name: Keep the failure where it can be read
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_S3_KEY_ID: ${{ secrets.SUPABASE_S3_KEY_ID }}
          SUPABASE_S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
        run: |
          ls "$RUNNER_TEMP"/*.log >/dev/null 2>&1 || exit 0
          out="$RUNNER_TEMP/check-failure.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            for f in "$RUNNER_TEMP"/[0-9]-*.log; do
              echo
              echo "=================== $(basename "$f")"
              grep -v '^✅' "$f" | grep -vE '^[[:space:]]*(#[0-9]+[[:space:]]|package:|dart:|\(elided)' | head -n 700
            done
          } > "$out"
          bash ci/keep.sh check "$out"
