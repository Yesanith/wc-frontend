name: Build recipe data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_recipes.py', 'tools/build_worldmap.py', 'tools/test_*.py', '.github/workflows/data.yml']
  schedule:
    # first of the month, game data only changes with patches
    - cron: '0 4 1 * *'

permissions:
  contents: write

# every part runs as its own job side by side, on its own runner and so
# with its own share of the api's rate limit. each hands its files to the
# commit job at the end, which commits them together or not at all. they are
# handed on through the cache under a key of this run, not as artifacts, whose
# small storage fills and then stops every run that uploads one
jobs:
  # the builders' logic is checked offline first, a broken build must not
  # replace the data the app ships with
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the icon tests draw with pillow
      - run: python -m pip install --quiet pillow
      - run: python -m unittest discover -s tools -p 'test_*.py'

  # english items, their search index, the trading post index and the recipe book
  book:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_recipes.py book
      - name: Hand the files on
        run: |
          mkdir -p out/assets/data
          cp assets/data/recipe_book.json.gz assets/data/item_index_en.txt.gz assets/data/market_index.txt.gz out/assets/data/
      - uses: actions/cache/save@v4
        with:
          key: data-book-${{ github.run_id }}
          path: out/

  # one search index per language the api translates. turkish, portuguese,
  # russian and japanese are absent on purpose: the api has none of them, so
  # those ask in english and reuse that index
  index:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [de, es, fr, zh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_recipes.py index ${{ matrix.lang }}
      - name: Hand the files on
        run: |
          mkdir -p out/assets/data
          cp assets/data/item_index_${{ matrix.lang }}.txt.gz out/assets/data/
      - uses: actions/cache/save@v4
        with:
          key: data-index-${{ matrix.lang }}-${{ github.run_id }}
          path: out/

  worldmap:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build world map markers and overview tiles
        run: python tools/build_worldmap.py en de es fr zh
      - name: Hand the files on
        run: |
          mkdir -p out/assets/data
          cp assets/data/worldmap_1_*.json.gz out/assets/data/
          cp -r assets/tiles out/assets/
      - uses: actions/cache/save@v4
        with:
          key: data-worldmap-${{ github.run_id }}
          path: out/

  commit:
    needs: [book, index, worldmap]
    # tags check out a detached head, only branch runs can push back
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # each part was saved to out/ under its own key; restored one after another they add up in out/
      - uses: actions/cache/restore@v4
        with:
          key: data-book-${{ github.run_id }}
          path: out/
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: data-index-de-${{ github.run_id }}
          path: out/
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: data-index-es-${{ github.run_id }}
          path: out/
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: data-index-fr-${{ github.run_id }}
          path: out/
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: data-index-zh-${{ github.run_id }}
          path: out/
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          key: data-worldmap-${{ github.run_id }}
          path: out/
          fail-on-cache-miss: true
      - name: Commit if changed
        run: |
          cp -r out/assets/. assets/
          # porcelain lists new files too, a plain diff would miss a file
          # for a language or floor that was never committed before
          if [ -z "$(git status --porcelain assets/data assets/tiles)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git status --short assets/data assets/tiles
          git config user.name "Yesanith"
          git config user.email "56350783+Yesanith@users.noreply.github.com"
          git add assets/data assets/tiles
          git commit -m "Regenerate recipe and world map data"
          # main may have moved on while the jobs ran. this only touches
          # assets, so replaying it on top is safe
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
