name: Smoke

# the site in a real browser: the page loads, a visitor is shown what the app is, a guest gets the app with its bar, the pages have addresses, the
# search finds them, and nothing the page throws goes unseen. it is a workflow of its own, so that it does not hold up the deploy of the site: it runs
# when the site has been deployed (after a wait, the pages are not served at once), every morning, and when it is asked to
on:
  workflow_run:
    workflows: ['Site']
    types: [completed]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'The address of the site, without a slash at the end (the pages of github when empty)'
        required: false

permissions:
  contents: read

jobs:
  smoke:
    # after a deploy that went well
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the pages to be served
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: e2e

      - name: Check the tests
        run: npx tsc --noEmit
        working-directory: e2e

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Look at the site
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
        working-directory: e2e
        env:
          BASE_URL: ${{ inputs.base_url || 'https://yesanith.github.io/wc-frontend' }}

      # what went wrong, kept in the bucket of Supabase (ci/keep.sh), so that it can be read without opening the run: what the tests said, and for each
      # that failed what the page had in it when it did (the tree the browser reads the page by, which says what is there and what it is called), with
      # the screenshots and the report of what the browser saw. nothing of it is an artifact of github
      - name: Keep the failure where it can be read
        if: failure()
        continue-on-error: true
        env:
          # an input is read as data by the script, never pasted into it
          SITE: ${{ inputs.base_url || 'https://yesanith.github.io/wc-frontend' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_S3_KEY_ID: ${{ secrets.SUPABASE_S3_KEY_ID }}
          SUPABASE_S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
        run: |
          test -f "$RUNNER_TEMP/smoke.log" || exit 0
          out="$RUNNER_TEMP/smoke-failure.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "site: $SITE"
            echo
            head -n 700 "$RUNNER_TEMP/smoke.log"
          } > "$out"
          bash ci/keep.sh smoke "$out" e2e/screenshots e2e/playwright-report e2e/test-results
