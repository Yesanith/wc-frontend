name: Smoke

# the site in a real browser: the page loads, a visitor is shown what the app is, a guest gets the app with its bar, the pages have addresses, the
# search finds them, and nothing the page throws goes unseen. it is a workflow of its own, so that it does not hold up the deploy of the site: it runs
# when the site has been deployed (after a wait, the pages are not served at once), every morning, and when it is asked to
on:
  workflow_run:
    workflows: ['Site']
    types: [completed]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'The address of the site, without a slash at the end (the pages of github when empty)'
        required: false

# write, to keep what went wrong on a branch where it can be read
permissions:
  contents: write

jobs:
  smoke:
    # after a deploy that went well
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the pages to be served
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: e2e

      - name: Check the tests
        run: npx tsc --noEmit
        working-directory: e2e

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Look at the site
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
        working-directory: e2e
        env:
          BASE_URL: ${{ inputs.base_url || 'https://yesanith.github.io/wc-frontend' }}

      # what went wrong, on a branch of its own, so that it can be read without opening the run: what the tests said, and for each that failed what the page
      # had in it when it did (the tree the browser reads the page by, which says what is there and what it is called)
      - name: Keep the failure where it can be read
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # an input is read as data by the script, never pasted into it
          SITE: ${{ inputs.base_url || 'https://yesanith.github.io/wc-frontend' }}
        run: |
          test -f "$RUNNER_TEMP/smoke.log" || exit 0
          dir="$(mktemp -d)"
          mkdir -p "$dir/snapshots"
          # the files of the tests that failed, the longest of them cut
          find e2e/test-results -name 'error-context.md' 2>/dev/null | while read -r f; do
            name="$(basename "$(dirname "$f")")"
            head -n 220 "$f" > "$dir/snapshots/${name:0:90}.md"
          done
          cd "$dir"
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs-smoke
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "site: $SITE"
            echo
            head -n 700 "$RUNNER_TEMP/smoke.log"
          } > smoke-failure.txt
          git add -A
          git commit -q -m "The smoke failure of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-smoke

      # what the browser saw, kept only when something went wrong
      - name: Keep what was seen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            e2e/screenshots
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 3
