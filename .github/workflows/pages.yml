name: Site

# the privacy policy, the account deletion page and the app itself, running in a
# browser, on github pages. the browser version is for the phones the app has no
# store version for. the supabase address and publishable key are written into the
# pages here, from the same secrets the app build uses
#
# only branches can deploy to the pages environment, so this cannot run on a tag. it runs on pushes to
# main, and again when the APK of a release has been built: the menu of the app in the browser names the
# last release, and a release is tagged after the push that the site was made for
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_site.py'
      - 'tools/test_build_site.py'
      - 'tools/site_content/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'ci/web.py'
      - 'ci/launcher/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # to drop the site's artifact once it is deployed
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # after the APK build only when it worked, a release that failed to build has no news for the menu
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the tags too, the app in the browser names the release it is built after
          fetch-depth: 0

      # the release that was published last, which is what the download button leads to. a tag is not a release: the build of a tag can fail, and the
      # tag stays, so the newest tag may name a version that has no app to download. the tag is the fallback for a repository that has no release yet
      - name: Find the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$TAG" ]; then TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"; fi
          echo "the app is named after $TAG"
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      # every language must have everything English has, a translation must keep every link and
      # command, and every link must lead somewhere
      - name: Check the pages
        run: python3 -m unittest test_build_site
        working-directory: tools

      # the page of the app: its name, what it is and what a link to it shows
      - name: Check the page of the app
        run: python3 -m unittest test_web
        working-directory: ci

      # not kept in the repository: made here from tools/site_content, then the backend is filled in
      - name: Make the pages
        run: python3 tools/build_site.py

      - name: Fill in the backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          # the page to delete an account is there in every language
          find site -name delete-account.html -not -path 'site/app/*' | while read -r page; do
            sed -i "s#__SUPABASE_URL__#$SUPABASE_URL#; s#__SUPABASE_PUBLISHABLE_KEY__#$SUPABASE_PUBLISHABLE_KEY#" "$page"
          done
          test "$(find site -name delete-account.html -not -path 'site/app/*' | wc -l)" -eq 9
          ! grep -rq '__SUPABASE' site --include=*.html

      # the recipe job commits its data to main after a push, take the newest
      - name: Use the newest recipe data
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- assets/data assets/tiles
          git status --short assets/data assets/tiles

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # web/ is not committed, generate it from the flutter template
      - name: Generate the web project
        run: |
          flutter create --platforms=web --org com.yesanith --project-name wondrous_compass .
          # the template adds a counter app test for a MyApp we do not have
          rm -f test/widget_test.dart

      # the page's colours, its icons and what iOS needs to keep it on the home screen
      - name: Set up the web build
        run: |
          python3 -m pip install --quiet pillow
          python3 ci/web.py

      - run: flutter pub get

      # the app lives in the app/ folder of the site
      - name: Build the app for the browser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # the notifications of a browser: the web app of the Firebase project and its Web Push certificate. without
          # them the page has no notifications, and says nothing of them
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # the last release, so the menu tells which build a browser has loaded
          TAG="$APP_TAG"
          # no service worker: it keeps the app on the device and shows the old one until a second
          # load, and the app is updated often. the page is fetched fresh, GitHub keeps it ten minutes
          flutter build web --release \
            --pwa-strategy=none \
            --base-href "/$REPO/app/" \
            --dart-define=APP_VERSION="${TAG#v}-web" \
            --dart-define=WEB_BASE_URL="https://$OWNER.github.io/$REPO/app/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_VAPID_KEY="$FIREBASE_VAPID_KEY"
          # the service worker of the notifications, next to the app, with the configuration written in
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_WEB_APP_ID" ] && [ -n "$FIREBASE_VAPID_KEY" ]; then
            CONFIG=$(jq -cn --arg apiKey "$FIREBASE_API_KEY" --arg projectId "$FIREBASE_PROJECT_ID" \
              --arg messagingSenderId "$FIREBASE_SENDER_ID" --arg appId "$FIREBASE_WEB_APP_ID" \
              '{apiKey: $apiKey, projectId: $projectId, messagingSenderId: $messagingSenderId, appId: $appId}')
            python3 -c 'import sys; t = open("ci/firebase-messaging-sw.js").read(); open("build/web/firebase-messaging-sw.js", "w").write(t.replace("__FIREBASE_CONFIG__", sys.argv[1]))' "$CONFIG"
            echo "notifications of the browser set up"
          else
            echo "no Firebase web app: the page has no notifications"
          fi

      - name: Put the app in the site
        run: |
          mkdir -p site/app
          cp -r build/web/. site/app/
          # the page the app is served from must not be mistaken for a missing file
          cp site/app/index.html site/app/404.html
          du -sh site/app
          ls site/app | head -20

      - uses: actions/configure-pages@v5
      # each attempt of a run has an artifact of its own: a re-run of a failed deployment from the
      # web page would otherwise leave two called github-pages, and the deployment refuses to pick one
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # github pages is deployed from an artifact and nothing else. once the site is out it is of no use, and it is dropped at
      # once rather than left to fill the small storage of artifacts, whatever the deployment did
      - name: Drop the site's artifact
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: github-pages-${{ github.run_attempt }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == env.NAME) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent && echo "dropped artifact $id"
          done
