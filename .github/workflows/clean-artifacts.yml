name: Clean artifacts
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUT=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate repos/${{ github.repository }}/actions/artifacts \
            --jq ".artifacts[] | select(.name != \"database-backup\" or .created_at < \"$CUT\") | .id" \
          | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}
